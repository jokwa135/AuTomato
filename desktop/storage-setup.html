<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; object-src 'none'"><title>Welcome to AuTomato</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="preferences.css"><link rel="stylesheet" href="appearance.css"></head>
<body class="appearance-page"><header class="appearance-header"><img src="assets/automato.png" alt=""><span>AuTomato · Your workspace, your computer</span><button id="setupClose" aria-label="Close setup">×</button></header>
